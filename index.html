<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Evaluasi Informatika & IT Support</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            max-width: 750px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        /* Login Screen Styles */
        .login-screen {
            text-align: center;
        }

        .login-screen h2 {
            margin-bottom: 10px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .login-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background-color: var(--primary-hover);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            font-weight: 500;
        }

        /* Quiz Interface */
        .quiz-interface {
            display: none;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: #0f172a;
        }

        .timer-box {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-container {
            background-color: var(--border-color);
            height: 8px;
            border-radius: 4px;
            width: 100%;
            margin-top: 15px;
        }

        .progress-bar {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-text {
            font-size: 1.125rem;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            list-style: none;
        }

        .option-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 20px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            line-height: 1.4;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary-color);
            background-color: #f8fafc;
            transform: translateY(-1px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #14532d;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--danger);
            color: #7f1d1d;
        }

        .rationale-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        footer {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #eff6ff;
            border: 5px solid var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px auto;
        }

        .student-info-tag {
            background-color: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="login-box" class="login-screen">
        <h2>Ujian Evaluasi Informatika</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Silakan masukkan identitas dan token akses Anda</p>
        
        <div class="form-group">
            <label for="student-name">Nama Lengkap Siswa</label>
            <input type="text" id="student-name" placeholder="Contoh: Ahmad Fauzi">
        </div>
        
        <div class="form-group">
            <label for="access-token">Token Akses Ujian</label>
            <input type="password" id="access-token" placeholder="Masukkan token khusus">
        </div>

        <button id="login-btn" class="login-btn">Masuk & Mulai Ujian</button>
        <p id="error-message" class="error-msg">Token salah atau nama belum diisi!</p>
    </div>

    <div id="quiz-box" class="quiz-interface">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>100 Latihan Informatika</h1>
                <div id="user-display" class="student-info-tag">Siswa: -</div>
            </div>
            <div class="header-meta">
                <div id="progress-text" class="question-number">Pertanyaan 1 dari 100</div>
                <div id="timer" class="timer-box">⏱ Sisa Waktu: 30:00</div>
            </div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </header>

        <main>
            <div id="question" class="question-text">Memuat pertanyaan...</div>
            <div id="options" class="options-list"></div>
            <div id="rationale" class="rationale-box"></div>
        </main>

        <footer>
            <button id="next-btn" class="next-btn">Pertanyaan Berikutnya</button>
        </footer>
    </div>

    <div id="result-box" class="result-screen">
        <h2>Ujian Selesai!</h2>
        <p id="completion-message" style="color: var(--text-muted); margin-top: 8px;">Berikut adalah hasil pencapaian kompetensi Anda:</p>
        <div id="score" class="score-circle">0</div>
        <p id="result-summary" style="font-size: 1.1rem; font-weight: 500; margin-bottom: 10px;"></p>
        <p id="score-details" style="color: var(--text-muted); margin-bottom: 15px;"></p>
        <p id="student-result-name" style="font-weight: bold; color: var(--text-main);"></p>
    </div>
</div>

<script>
    const validTokens = ["SISWA01", "SISWA02", "SISWA03", "ITCOMP2026", "OPERATORMUDA", "INFORMATIKA30"];

    const quizData = [
        {
            question: "Dalam proyek aplikasi perpustakaan, tim membagi pekerjaan menjadi modul login, katalog buku, peminjaman, dan pengembalian. Konsep berpikir komputasional yang diterapkan adalah ...",
            options: [
                { text: "A. Simulasi", isCorrect: false, rationale: "Simulasi berkaitan dengan pemodelan proses, bukan memecah pekerjaan." },
                { text: "B. Dekomposisi", isCorrect: true, rationale: "Dekomposisi berarti memecah masalah atau pekerjaan besar menjadi bagian-bagian kecil agar lebih mudah dikelola." },
                { text: "C. Abstraksi", isCorrect: false, rationale: "Abstraksi berfokus pada informasi penting dan mengabaikan detail yang tidak relevan." },
                { text: "D. Pengenalan pola", isCorrect: false, rationale: "Pengenalan pola adalah kemampuan menemukan kesamaan pada beberapa masalah." }
            ]
        },
        {
            question: "Seorang siswa membuat jadwal belajar dan memecahnya menjadi kegiatan membaca, mencatat, dan latihan soal. Ini merupakan contoh ...",
            options: [
                { text: "A. Kompresi", isCorrect: false, rationale: "Kompresi adalah pemadatan ukuran file/data." },
                { text: "B. Dekomposisi", isCorrect: true, rationale: "Membagi jadwal menjadi beberapa kegiatan terpisah merupakan penerapan dekomposisi." },
                { text: "C. Pengurutan", isCorrect: false, rationale: "Pengurutan menyusun data berdasarkan aturan tertentu." },
                { text: "D. Enkripsi", isCorrect: false, rationale: "Enkripsi adalah pengamanan data dengan penyandian." }
            ]
        },
        {
            question: "Ketika membuat denah sekolah, detail seperti motif sepatu siswa tidak dicantumkan karena tidak diperlukan. Prinsip yang digunakan adalah ...",
            options: [
                { text: "A. Algoritma", isCorrect: false, rationale: "Algoritma adalah urutan langkah penyelesaian masalah." },
                { text: "B. Pengenalan pola", isCorrect: false, rationale: "Pengenalan pola mencari kesamaan struktur/data." },
                { text: "C. Abstraksi", isCorrect: true, rationale: "Abstraksi berfokus pada informasi penting untuk tujuan tertentu dan mengabaikan detail tidak relevan." },
                { text: "D. Iterasi", isCorrect: false, rationale: "Iterasi adalah proses pengulangan." }
            ]
        },
        {
            question: "Pada beberapa soal matematika, siswa menyadari bahwa semuanya dapat diselesaikan dengan mencari selisih dua bilangan. Kemampuan mengenali kesamaan ini disebut ...",
            options: [
                { text: "A. Pengenalan pola", isCorrect: true, rationale: "Pengenalan pola adalah kemampuan menemukan kesamaan atau keteraturan pada beberapa masalah." },
                { text: "B. Output", isCorrect: false, rationale: "Output adalah hasil pemrosesan data." },
                { text: "C. Debugging", isCorrect: false, rationale: "Debugging adalah proses menemukan dan memperbaiki kesalahan program." },
                { text: "D. Dekomposisi", isCorrect: false, rationale: "Dekomposisi adalah memecah masalah besar menjadi bagian kecil." }
            ]
        },
        {
            question: "Urutan instruksi yang logis untuk menyelesaikan suatu masalah disebut ...",
            options: [
                { text: "A. Algoritma", isCorrect: true, rationale: "Algoritma merupakan urutan langkah yang logis, jelas, dan sistematis untuk menyelesaikan masalah." },
                { text: "B. Perangkat keras", isCorrect: false, rationale: "Perangkat keras adalah komponen fisik komputer." },
                { text: "C. Jaringan", isCorrect: false, rationale: "Jaringan adalah sistem komputer terhubung." },
                { text: "D. Variabel", isCorrect: false, rationale: "Variabel adalah penampung nilai dalam pemrograman." }
            ]
        },
        {
            question: "Sebelum menyusun algoritma membuat teh, tindakan yang paling tepat adalah ...",
            options: [
                { text: "A. Menentukan langkah dan urutannya", isCorrect: true, rationale: "Langkah dasar penyusunan algoritma adalah menentukan urutan tindakan secara sistematis." },
                { text: "B. Menyalakan komputer", isCorrect: false, rationale: "Membuat teh adalah algoritma manual yang tidak membutuhkan komputer." },
                { text: "C. Mengurutkan file", isCorrect: false, rationale: "Mengurutkan file tidak ada hubungannya dengan pembuatan teh." },
                { text: "D. Menghapus semua bahan", isCorrect: false, rationale: "Menghapus bahan akan menggagalkan proses." }
            ]
        },
        {
            question: "Manakah contoh abstraksi saat merancang aplikasi peta perjalanan?",
            options: [
                { text: "A. Menampilkan warna baju semua orang", isCorrect: false, rationale: "Warna baju pengguna jalan tidak relevan untuk navigasi." },
                { text: "B. Menampilkan jalan dan lokasi penting", isCorrect: true, rationale: "Hanya menyajikan fitur jalan dan lokasi utama merupakan penerapan abstraksi yang tepat." },
                { text: "C. Mencatat merek sepatu pengguna", isCorrect: false, rationale: "Merek sepatu adalah detail yang tidak relevan." },
                { text: "D. Mencantumkan semua suara di jalan", isCorrect: false, rationale: "Suara jalanan merupakan informasi yang mengganggu dan tidak berguna untuk aplikasi peta." }
            ]
        },
        {
            question: "Masalah besar lebih mudah diselesaikan setelah dibagi menjadi beberapa bagian kecil. Keuntungan utama cara ini adalah ...",
            options: [
                { text: "A. Komputer tidak perlu program", isCorrect: false, rationale: "Komputer tetap memerlukan instruksi/program." },
                { text: "B. Semua proses otomatis", isCorrect: false, rationale: "Dekomposisi tidak serta merta membuat otomatisasi." },
                { text: "C. Data pasti hilang", isCorrect: false, rationale: "Dekomposisi tidak menghilangkan data." },
                { text: "D. Masalah menjadi lebih terkelola", isCorrect: true, rationale: "Memecah masalah membuat tiap bagian lebih fokus dan mudah diselesaikan secara terstruktur." }
            ]
        },
        {
            question: "Sebuah algoritma memiliki langkah yang tidak jelas dan dapat ditafsitkan berbeda. Kualitas algoritma yang belum terpenuhi adalah ...",
            options: [
                { text: "A. Kecepatan jaringan", isCorrect: false, rationale: "Kecepatan jaringan tidak mempengaruhi kejelasan logika." },
                { text: "B. Resolusi layar", isCorrect: false, rationale: "Resolusi layar adalah tampilan visual." },
                { text: "C. Kapasitas memori", isCorrect: false, rationale: "Kapasitas memori terkait ruang penyimpanan." },
                { text: "D. Ketidakjelasan instruksi", isCorrect: true, rationale: "Algoritma harus bersifat unambigu (tidak bermakna ganda) dan jelas setiap langkahnya." }
            ]
        },
        {
            question: "Dalam berpikir komputasional, langkah penyelesaian yang dapat diikuti secara sistematis disebut ...",
            options: [
                { text: "A. Algoritma", isCorrect: true, rationale: "Algoritma adalah deretan langkah sistematis penyelesaian masalah." },
                { text: "B. LAN", isCorrect: false, rationale: "LAN adalah jenis jaringan komputer lokal." },
                { text: "C. Monitor", isCorrect: false, rationale: "Monitor adalah perangkat output visual." },
                { text: "D. Spreadsheet", isCorrect: false, rationale: "Spreadsheet adalah aplikasi pengolah angka." }
            ]
        },
        {
            question: "Daftar angka [8, 3, 6, 2] dicari dengan linear search untuk menemukan angka 6. Berapa elemen yang diperiksa sampai angka ditemukan?",
            options: [
                { text: "A. 1", isCorrect: false, rationale: "Elemen ke-1 adalah 8." },
                { text: "B. 4", isCorrect: false, rationale: "Elemen ke-4 adalah 2." },
                { text: "C. 2", isCorrect: false, rationale: "Elemen ke-2 adalah 3." },
                { text: "D. 3", isCorrect: true, rationale: "Pemeriksaan berurutan: 8 (1), 3 (2), lalu 6 (3). Maka butuh 3 pemeriksaan." }
            ]
        },
        {
            question: "Linear search paling tepat digunakan ketika ...",
            options: [
                { text: "A. Semua data berbentuk gambar", isCorrect: false, rationale: "Format data bukan alasan utama memilih algoritma pencarian." },
                { text: "B. Tidak ada target pencarian", isCorrect: false, rationale: "Pencarian memerlukan target." },
                { text: "C. Memeriksa elemen satu per satu", isCorrect: true, rationale: "Linear search bekerja dengan memindai elemen satu per satu dari awal sampai akhir." },
                { text: "D. Data harus selalu terurut", isCorrect: false, rationale: "Linear search tidak mewajibkan data terurut." }
            ]
        },
        {
            question: "Pada daftar [12, 7, 9, 4], pencarian linear untuk angka 4 membutuhkan pemeriksaan sebanyak ...",
            options: [
                { text: "A. 1 elemen", isCorrect: false, rationale: "12 adalah elemen pertama." },
                { text: "B. 4 elemen", isCorrect: true, rationale: "Angka 4 berada di urutan ke-4, sehingga memeriksa 12, 7, 9, dan 4 (total 4 elemen)." },
                { text: "C. 2 elemen", isCorrect: false, rationale: "7 adalah elemen kedua." },
                { text: "D. 3 elemen", isCorrect: false, rationale: "9 adalah elemen ketiga." }
            ]
        },
        {
            question: "Jika target berada pada posisi pertama suatu daftar, linear search memerlukan ...",
            options: [
                { text: "A. Satu pemeriksaan", isCorrect: true, rationale: "Target langsung ditemukan pada perbandingan pertama (best case)." },
                { text: "B. Pengurutan terlebih dahulu", isCorrect: false, rationale: "Linear search tidak butuh pengurutan." },
                { text: "C. Dua pemeriksaan", isCorrect: false, rationale: "Dua pemeriksaan untuk posisi kedua." },
                { text: "D. N pemeriksaan selalu", isCorrect: false, rationale: "N pemeriksaan terjadi pada worst case." }
            ]
        },
        {
            question: "Daftar berisi 10 elemen. Dalam kondisi terburuk, linear search memeriksa ...",
            options: [
                { text: "A. 5 elemen", isCorrect: false, rationale: "5 elemen merupakan rata-rata pencarian." },
                { text: "B. 10 elemen", isCorrect: true, rationale: "Kondisi terburuk (worst case) terjadi jika target di posisi terakhir atau tidak ada, yakni sebanyak N (10) elemen." },
                { text: "C. 1 elemen", isCorrect: false, rationale: "1 elemen adalah kondisi terbaik." },
                { text: "D. 9 elemen", isCorrect: false, rationale: "9 elemen adalah posisi sebelum terakhir." }
            ]
        },
        {
            question: "Apa yang dilakukan linear search jika target tidak ditemukan dalam daftar?",
            options: [
                { text: "A. Berhenti setelah semua elemen diperiksa", isCorrect: true, rationale: "Pencarian berakhir setelah memindai seluruh isi daftar tanpa hasil." },
                { text: "B. Mengurutkan daftar otomatis", isCorrect: false, rationale: "Pencarian tidak mengurutkan data." },
                { text: "C. Selalu mengembalikan elemen pertama", isCorrect: false, rationale: "Elemen pertama bukan penanda gagal." },
                { text: "D. Mengubah semua data", isCorrect: false, rationale: "Linear search tidak memodifikasi data." }
            ]
        },
        {
            question: "Pada daftar [5, 1, 8, 3], pencarian angka 8 memeriksa urutan ...",
            options: [
                { text: "A. 8 saja tanpa pemeriksaan", isCorrect: false, rationale: "Linear search harus memeriksa dari awal." },
                { text: "B. 5 lalu 1 lalu 8", isCorrect: true, rationale: "Pemeriksaan berurutan dimulait dari indeks 0: angka 5, 1, lalu 8." },
                { text: "C. 1 lalu 5 lalu 8", isCorrect: false, rationale: "Urutan data asli tidak diawali dengan 1." },
                { text: "D. 3 lalu 8", isCorrect: false, rationale: "3 ada di urutan terakhir, bukan awal." }
            ]
        },
        {
            question: "Salah satu kelebihan linear search adalah ...",
            options: [
                { text: "A. Mudah diterapkan pada data yang belum terurut", isCorrect: true, rationale: "Linear search sederhana dan fleksibel karena dapat langsung digunakan pada data acak/acak-acakan." },
                { text: "B. Selalu lebih cepat daripada semua metode", isCorrect: false, rationale: "Binary search lebih cepat untuk data terurut." },
                { text: "C. Memerlukan data terurut", isCorrect: false, rationale: "Linear search tidak mewajibkan data terurut." },
                { text: "D. Hanya bekerja pada angka", isCorrect: false, rationale: "Dapat bekerja pada teks/string." }
            ]
        },
        {
            question: "Apa yang dimaksud satu pass pada Bubble Sort?",
            options: [
                { text: "A. Menyimpan file", isCorrect: false, rationale: "Penyimpanan file adalah operasi I/O." },
                { text: "B. Menghapus satu baris", isCorrect: false, rationale: "Bukan operasi pengurutan." },
                { text: "C. Satu putaran membandingkan pasangan elemen berdekatan", isCorrect: true, rationale: "Satu pass adalah proses menyisir seluruh daftar dari awal ke akhir sambil membandingkan pasangan berdekatan." },
                { text: "D. Mencari satu nilai saja", isCorrect: false, rationale: "Itu adalah pencarian (searching)." }
            ]
        },
        {
            question: "Bubble Sort mengurutkan data menaik dengan cara menukar pasangan ketika ...",
            options: [
                { text: "A. Elemen kiri lebih besar dari elemen kanan", isCorrect: true, rationale: "Untuk urutan menaik (ascending), jika kiri > kanan, maka harus ditukar agar yang lebih besar bergeser ke kanan." },
                { text: "B. Elemen kiri lebih kecil dari elemen kanan", isCorrect: false, rationale: "Jika kiri < kanan, posisi sudah benar." },
                { text: "C. Kedua elemen sama", isCorrect: false, rationale: "Jika sama, tidak perlu ditukar." },
                { text: "D. Daftar sudah kosong", isCorrect: false, rationale: "Daftar kosong tidak diproses." }
            ]
        },
        {
            question: "Dalam Bubble Sort, data [4, 2] setelah satu perbandingan dan pertukaran menjadi ...",
            options: [

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalTime = 30 * 60; // 30 Menit
        resultBox.style.display = 'none';
        completionMessage.innerText = "Berikut adalah hasil pencapaian kompetensi Anda:";
        
        clearInterval(timerInterval);
        startTimer();
        showQuestion();
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            totalTime--;
            updateTimerDisplay();

            if (totalTime <= 0) {
                clearInterval(timerInterval);
                completionMessage.innerText = "Waktu Habis! Ujian otomatis dihentikan oleh sistem.";
                showResults();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(totalTime / 60);
        const seconds = totalTime % 60;
        timerElement.innerText = `⏱ Sisa Waktu: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (totalTime < 300) { // Sisa < 5 menit
            timerElement.style.backgroundColor = "#fee2e2";
            timerElement.style.color = "#dc2626";
        } else {
            timerElement.style.backgroundColor = "#f1f5f9";
            timerElement.style.color = "#475569";
        }
    }

    function showQuestion() {
        resetState();
        let currentQuestion = quizData[currentQuestionIndex];
        
        progressText.innerText = `Pertanyaan ${currentQuestionIndex + 1} dari ${quizData.length}`;
        progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;
        questionElement.innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;

        currentQuestion.options.forEach(option => {
            const button = document.createElement('button');
            button.innerText = option.text;
            button.classList.add('option-btn');
            if (option.isCorrect) button.dataset.correct = option.isCorrect;
            button.dataset.rationale = option.rationale;
            button.addEventListener('click', selectAnswer);
            optionsContainer.appendChild(button);
        });
    }

    function resetState() {
        nextButton.style.display = 'none';
        rationaleBox.style.display = 'none';
        rationaleBox.innerText = '';
        while (optionsContainer.firstChild) {
            optionsContainer.removeChild(optionsContainer.firstChild);
        }
    }

    function selectAnswer(e) {
        const selectedButton = e.target;
        const isCorrect = selectedButton.dataset.correct === "true";
        
        if (isCorrect) {
            selectedButton.classList.add('correct');
            score++;
        } else {
            selectedButton.classList.add('wrong');
        }

        Array.from(optionsContainer.children).forEach(button => {
            if (button.dataset.correct === "true") button.classList.add('correct');
            button.disabled = true;
        });

        rationaleBox.innerHTML = `<strong>Analisis Soal:</strong> ${selectedButton.dataset.rationale}`;
        rationaleBox.style.display = 'block';

        nextButton.style.display = 'block';
        if (quizData.length === currentQuestionIndex + 1) {
            nextButton.innerText = "Lihat Hasil Skor";
        } else {
            nextButton.innerText = "Pertanyaan Berikutnya";
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        quizBox.style.display = 'none';
        resultBox.style.display = 'block';
        
        const finalScore = Math.round((score / quizData.length) * 100);
        scoreElement.innerText = finalScore;
        studentResultName.innerText = `Nama Peserta: ${studentName}`;
        scoreDetails.innerText = `Anda menjawab benar sebanyak ${score} dari ${quizData.length} pertanyaan.`;

        if (finalScore >= 85) {
            resultSummary.innerText = "Sangat Kompeten (Lulus Memuaskan!) 🌟";
            resultSummary.style.color = "var(--success)";
        } else if (finalScore >= 65) {
            resultSummary.innerText = "Kompeten (Memenuhi Standar Kelulusan) 👍";
            resultSummary.style.color = "var(--primary-color)";
        } else {
            resultSummary.innerText = "Butuh Pelatihan Tambahan (Tidak Lulus) 📚";
            resultSummary.style.color = "var(--danger)";
        }
    }

    nextButton.addEventListener('click', () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            showQuestion();
        } else {
            showResults();
        }
    });
</script>
</body>
</html>
